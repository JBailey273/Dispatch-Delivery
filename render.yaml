# Render Blueprint for Dispatch Delivery monorepo.
# Import this file in Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: dispatch-web
    runtime: node
    rootDir: apps/web
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://dispatch-api.onrender.com/api/v1

  - type: web
    name: dispatch-api
    runtime: python
    rootDir: apps/api
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dispatch-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: dispatch-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: CHANNEL_API_KEYS_JSON
        sync: false

  - type: worker
    name: dispatch-worker
    runtime: python
    rootDir: apps/worker
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m worker.main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dispatch-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: dispatch-redis
          type: redis
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

  - type: redis
    name: dispatch-redis
    ipAllowList: []
    plan: starter

databases:
  - name: dispatch-postgres
    databaseName: dispatch
    user: dispatch
    plan: basic-256mb
